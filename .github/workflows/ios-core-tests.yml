name: iOS Core Tests

on:
  push:
    branches:
      - feature/hybrid-offline-ios
  pull_request:
    branches:
      - main

jobs:
  swift-package-tests:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build and test core package
        run: swift test --package-path ios
